<!-- Fork: redesign shell. Upstream modules are moved into the rd-* slots at boot (see modules/redesign/Shell.ts).
     Never use `if`/`ifnot`/`with` bindings around slots: they would destroy the relocated modules. -->
<div id="rd-shell" data-bind="attr: { 'data-state': RedesignShell.stateName() }, css: { 'has-mini': RedesignShell.miniVisible(), 'bf-idle': RedesignShell.stateName() === 'battleFrontier' && !RedesignShell.isFighting() }">
    <header id="rd-top">
        <div class="rd-where">
            <small>
                <span data-bind="text: RedesignShell.regionName()"></span>
                <!-- ko if: RedesignShell.routeKills() !== null -->
                · <span class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.routeKills())"></span>
                <span data-bind="text: RedesignShell.label('defeated')"></span>
                <!-- /ko -->
            </small>
            <b>
                <span data-bind="text: RedesignShell.locationName()"></span>
                <!-- ko if: RedesignShell.routeMark() -->
                <span class="rd-mark" aria-hidden="true" data-bind="text: RedesignShell.routeMark()"></span>
                <span class="sr-only" data-bind="text: RedesignShell.routeMark() === '✶' ? RedesignShell.label('routeShiny') : RedesignShell.label('routeCaught')"></span>
                <!-- /ko -->
            </b>
        </div>
        <!-- ko if: RedesignShell.dexStats() -->
        <div class="rd-dex" data-bind="attr: { title: RedesignShell.label('dexTitle') }">
            <span class="rd-dex-item"><img src="assets/images/pokeball/Pokeball.svg" alt="" aria-hidden="true"><b class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.dexStats().caught)"></b><small class="rd-num" data-bind="text: '/' + RedesignShell.formatNumber(RedesignShell.dexStats().total)"></small></span>
            <span class="rd-dex-item"><span class="rd-dex-star" aria-hidden="true">✶</span><b class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.dexStats().shiny)"></b></span>
            <span class="sr-only" data-bind="text: RedesignShell.label('dexSr').replace('{c}', RedesignShell.dexStats().caught).replace('{t}', RedesignShell.dexStats().total).replace('{s}', RedesignShell.dexStats().shiny)"></span>
        </div>
        <!-- /ko -->
        <button type="button" class="rd-icon-btn rd-top-menu" data-bind="click: () => RedesignShell.toggleMenu(), attr: { 'aria-label': RedesignShell.page() === 'menu' ? RedesignShell.label('close') : RedesignShell.label('menu'), 'aria-expanded': RedesignShell.page() === 'menu' ? 'true' : 'false' }, css: { 'is-active': RedesignShell.page() === 'menu' }">
            <svg aria-hidden="true"><use data-bind="attr: { href: RedesignShell.page() === 'menu' ? 'assets/images/redesign/icons.svg#i-x' : 'assets/images/redesign/icons.svg#i-menu' }"></use></svg>
        </button>
    </header>

    <nav id="rd-nav" aria-label="Pages">
        <button type="button" data-bind="click: () => RedesignShell.go('combat'), css: { 'is-active': RedesignShell.page() === 'combat' }, attr: { 'aria-current': RedesignShell.page() === 'combat' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-swords"></use></svg>
            <span data-bind="text: RedesignShell.label('combat')"></span>
        </button>
        <button type="button" data-bind="click: () => RedesignShell.go('progress'), css: { 'is-active': RedesignShell.page() === 'progress' }, attr: { 'aria-current': RedesignShell.page() === 'progress' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-trophy"></use></svg>
            <span data-bind="text: RedesignShell.label('progress')"></span>
        </button>
        <button type="button" data-bind="click: () => RedesignShell.go('items'), css: { 'is-active': RedesignShell.page() === 'items' }, attr: { 'aria-current': RedesignShell.page() === 'items' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-backpack"></use></svg>
            <span data-bind="text: RedesignShell.label('items')"></span>
        </button>
        <button type="button" data-bind="click: () => RedesignShell.go('pokemon'), css: { 'is-active': RedesignShell.page() === 'pokemon' }, attr: { 'aria-current': RedesignShell.page() === 'pokemon' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-layout-grid"></use></svg>
            <span data-bind="text: RedesignShell.label('pokemon')"></span>
        </button>
        <button type="button" data-bind="click: () => RedesignShell.go('activities'), css: { 'is-active': RedesignShell.page() === 'activities' }, attr: { 'aria-current': RedesignShell.page() === 'activities' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-sprout"></use></svg>
            <span data-bind="text: RedesignShell.label('activities')"></span>
        </button>
        <button type="button" class="rd-nav-menu" data-bind="click: () => RedesignShell.toggleMenu(), css: { 'is-active': RedesignShell.page() === 'menu' }, attr: { 'aria-current': RedesignShell.page() === 'menu' ? 'page' : null }">
            <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-menu"></use></svg>
            <span data-bind="text: RedesignShell.label('menu')"></span>
        </button>
    </nav>

    <main id="rd-main" data-bind="attr: { 'data-page': RedesignShell.page() }">
        <!-- Combat dock: the fight, Poké Balls and currencies. Docked on desktop, top of the Combat page on mobile. -->
        <section id="rd-dock" aria-label="Combat">
            <!-- Quick automation toggles, above the fight. -->
            <div id="rd-quick" role="group" data-bind="attr: { 'aria-label': RedesignShell.label('automation') }">
                <!-- ko foreach: RedesignAutomation.quick -->
                <button type="button" class="rd-chip" data-bind="click: () => feature.toggle(), enable: usable(), css: { 'is-on': feature.enabled() }, attr: { 'aria-pressed': feature.enabled() ? 'true' : 'false', title: usable() ? feature.description() : RedesignShell.label('notHere') }">
                    <span class="rd-chip-label" data-bind="text: label()"></span>
                    <!-- ko if: status() --><small class="rd-num" data-bind="text: status()"></small><!-- /ko -->
                </button>
                <!-- /ko -->
                <button type="button" class="rd-chip rd-chip-more" data-bind="click: () => RedesignShell.goToAutomation(), css: { 'is-on': RedesignAutomation.othersActive() > 0 }, attr: { 'aria-label': RedesignShell.label('autoMore') }">
                    <!-- ko if: RedesignAutomation.othersActive() --><b class="rd-num" data-bind="text: '+' + RedesignAutomation.othersActive()"></b><!-- /ko -->
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-sliders"></use></svg>
                </button>
            </div>
            <!-- Trading-card top line: name left, HP right, energy marks below. Present for the
                 whole battle (also while exploring a dungeon) so nothing below it jumps. -->
            <!-- ko if: RedesignShell.isFighting() -->
            <div id="rd-foehead">
                <div class="rd-foe-id">
                    <span class="rd-foe-name" data-bind="text: RedesignShell.headName()"></span>
                    <!-- ko if: RedesignShell.foe() -->
                    <span class="rd-foe-types" data-bind="foreach: RedesignShell.foeTypes()">
                        <span class="rd-energy-type"><i class="rd-energy" data-bind="style: { backgroundColor: $data.color }"></i><span data-bind="text: $data.name"></span></span>
                    </span>
                    <!-- /ko -->
                    <!-- ko ifnot: RedesignShell.foe() -->
                    <span class="rd-foe-types"><span class="rd-energy-type" data-bind="text: RedesignShell.headSub()"></span></span>
                    <!-- /ko -->
                </div>
                <!-- ko if: RedesignShell.foe() -->
                <div class="rd-foe-hp">
                    <small data-bind="text: RedesignShell.label('hp')"></small>
                    <b class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.foe().health())"></b>
                </div>
                <!-- /ko -->
            </div>
            <!-- /ko -->
            <div id="rd-dock-fight" class="rd-slot"></div>
            <div id="rd-dock-currency" class="rd-slot"></div>
            <div id="rd-dock-balls" class="rd-slot"></div>
        </section>

        <section class="rd-page" id="rd-page-combat">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('map')"></h2>
            <div id="rd-slot-combat" class="rd-slot"></div>
        </section>

        <section class="rd-page" id="rd-page-progress" data-bind="attr: { 'data-tab': RedesignShell.progressTab() }">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('progress')"></h2>
            <div class="rd-tabs" role="tablist">
                <button type="button" role="tab" data-bind="click: () => RedesignShell.progressTab('quests'), attr: { 'aria-selected': RedesignShell.progressTab() === 'quests' ? 'true' : 'false' }, text: RedesignShell.label('quests')"></button>
                <button type="button" role="tab" data-bind="click: () => RedesignShell.progressTab('lines'), attr: { 'aria-selected': RedesignShell.progressTab() === 'lines' ? 'true' : 'false' }, text: RedesignShell.label('questLines')"></button>
                <button type="button" role="tab" data-bind="click: () => RedesignShell.progressTab('achievements'), attr: { 'aria-selected': RedesignShell.progressTab() === 'achievements' ? 'true' : 'false' }, text: RedesignShell.label('achievements')"></button>
            </div>
            <div class="rd-actions">
                <button type="button" class="rd-action rd-tab-quests" data-toggle="modal" href="#QuestModal">
                    <span data-bind="text: RedesignShell.label('questsAll')"></span>
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-chevron-right"></use></svg>
                </button>
                <button type="button" class="rd-action rd-tab-achievements" data-toggle="modal" href="#achievementsModal" onclick="AchievementHandler.filterAchievementList(true);">
                    <span data-bind="text: RedesignShell.label('achievementsAll')"></span>
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-chevron-right"></use></svg>
                </button>
            </div>
            <div id="rd-slot-progress" class="rd-slot"></div>
        </section>

        <section class="rd-page" id="rd-page-items">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('items')"></h2>
            <div id="rd-slot-items" class="rd-slot"></div>
        </section>

        <section class="rd-page" id="rd-page-pokemon">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('pokemon')"></h2>
            <div id="rd-slot-pokemon" class="rd-slot"></div>
        </section>

        <section class="rd-page" id="rd-page-activities">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('activities')"></h2>
            <div id="rd-slot-activities" class="rd-slot"></div>
            <p class="rd-empty" data-bind="text: RedesignShell.label('activitiesEmpty')"></p>
        </section>

        <section class="rd-page" id="rd-page-menu">
            <h2 class="rd-page-title" data-bind="text: RedesignShell.label('menu')"></h2>

            <h3 class="rd-section-title" data-bind="text: RedesignShell.label('automation')"></h3>
            <div id="rd-menu-automation" data-bind="foreach: RedesignAutomation.groups">
                <!-- ko if: $data.id !== 'vanilla' -->
                <h4 class="rd-group-title" data-bind="text: $data.title"></h4>
                <!-- /ko -->
                <div class="rd-list" data-bind="foreach: $data.features">
                    <div class="rd-auto" data-bind="css: { 'is-on': enabled(), 'is-unavailable': !available(), 'is-open': expanded() }">
                        <div class="rd-auto-row">
                            <button type="button" class="rd-auto-main" data-bind="click: () => expanded(!expanded()), attr: { 'aria-expanded': expanded() ? 'true' : 'false' }">
                                <span class="rd-auto-name"><span data-bind="text: name()"></span><svg class="rd-auto-caret" aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-chevron-down"></use></svg></span>
                                <!-- ko if: lastError() || statusText() -->
                                <span class="rd-auto-sub">
                                    <!-- ko if: lastError() --><span class="rd-auto-error" data-bind="text: lastError()"></span><!-- /ko -->
                                    <!-- ko ifnot: lastError() --><span data-bind="text: statusText()"></span><!-- /ko -->
                                </span>
                                <!-- /ko -->
                            </button>
                            <button type="button" role="switch" class="rd-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false', 'aria-label': name() }"><i></i></button>
                        </div>
                        <!-- ko if: expanded() -->
                        <div class="rd-auto-detail">
                            <p class="rd-auto-desc" data-bind="text: description()"></p>
                            <!-- ko if: warning() --><p class="rd-auto-warning" data-bind="text: warning()"></p><!-- /ko -->
                            <!-- ko foreach: def.options || [] -->
                            <label class="rd-opt" data-bind="css: 'rd-opt-' + $data.type">
                                <span class="rd-opt-label" data-bind="text: $parent.optionLabel($data)"></span>
                                <!-- ko if: $data.type === 'number' -->
                                <span class="rd-opt-range">
                                    <input type="range" data-bind="value: $parent.options[$data.key], valueUpdate: 'input', attr: { min: $data.min, max: $data.max, step: $data.step || 1 }">
                                    <output class="rd-num" data-bind="text: $parent.options[$data.key]()"></output>
                                </span>
                                <!-- /ko -->
                                <!-- ko if: $data.type === 'boolean' -->
                                <input type="checkbox" data-bind="checked: $parent.options[$data.key]">
                                <!-- /ko -->
                                <!-- ko if: $data.type === 'select' -->
                                <select class="custom-select" data-bind="value: $parent.options[$data.key]">
                                    <!-- ko foreach: $data.choices -->
                                    <option data-bind="value: $data.value, text: $parents[1].choiceLabel($data)"></option>
                                    <!-- /ko -->
                                </select>
                                <!-- /ko -->
                            </label>
                            <!-- /ko -->
                        </div>
                        <!-- /ko -->
                    </div>
                </div>
            </div>

            <h3 class="rd-section-title" data-bind="text: RedesignShell.label('interface')"></h3>
            <div class="rd-list rd-grid">
                <button type="button" class="rd-row" data-bind="click: () => Settings.getSetting('sound.muted').toggle()">
                    <svg aria-hidden="true"><use data-bind="attr: { href: Settings.getSetting('sound.muted').observableValue() ? 'assets/images/redesign/icons.svg#i-volume-x' : 'assets/images/redesign/icons.svg#i-volume-2' }"></use></svg>
                    <span data-bind="text: RedesignShell.label('sound')"></span>
                    <span class="rd-row-value" data-bind="text: Settings.getSetting('sound.muted').observableValue() ? 'Off' : 'On'"></span>
                </button>
                <!-- ko if: RedesignShell.keepAwakeSupported -->
                <button type="button" class="rd-row" role="switch" data-bind="click: () => RedesignShell.toggleKeepAwake(), attr: { 'aria-checked': RedesignShell.keepAwake() ? 'true' : 'false' }">
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-sun"></use></svg>
                    <span data-bind="text: RedesignShell.label('keepAwake')"></span>
                    <span class="rd-row-value" data-bind="text: RedesignShell.keepAwake() ? 'On' : 'Off'"></span>
                </button>
                <!-- /ko -->
                <button type="button" class="rd-row" data-bind="click: () => Save.store(player, true)">
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-save"></use></svg>
                    <span data-bind="text: RedesignShell.label('save')"></span>
                </button>
                <button type="button" class="rd-row" data-bind="click: () => RedesignShell.setClassic(true)">
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-refresh-cw"></use></svg>
                    <span>
                        <span data-bind="text: RedesignShell.label('classicUI')"></span>
                        <small class="rd-row-hint" data-bind="text: RedesignShell.label('classicUIHint')"></small>
                    </span>
                </button>
            </div>

            <h3 class="rd-section-title" data-bind="text: RedesignShell.label('gameMenu')"></h3>
            <div id="rd-menu-game"></div>

            <div class="rd-list rd-grid">
                <button type="button" class="rd-row" data-toggle="modal" href="#rdSourceModal">
                    <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-code"></use></svg>
                    <span>
                        <span data-bind="text: RedesignShell.label('sourceLicense')"></span>
                        <small class="rd-row-hint" data-bind="text: RedesignShell.label('sourceLicenseHint')"></small>
                    </span>
                </button>
            </div>
        </section>
    </main>

    <!-- New version banner (the game is saved before reloading). -->
    <div id="rd-update" role="status" data-bind="visible: RedesignShell.updateReady()" style="display: none;">
        <span data-bind="text: RedesignShell.label('updateAvailable')"></span>
        <button type="button" class="rd-update-btn" data-bind="click: () => RedesignShell.applyUpdate(), text: RedesignShell.label('updateNow')"></button>
    </div>

    <!-- Shell-owned controls relocated into upstream modules at boot (see relocate()). -->
    <div class="rd-parking" hidden>
        <div id="rd-balls-tools" class="rd-balls-tools" data-bind="with: RedesignAutomation.Automation.find('catchSpeed')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('zeroDelay')"></span>
            </button>
        </div>
        <div id="rd-hatch-tools" class="rd-switch-row">
            <!-- ko with: RedesignAutomation.Automation.find('autoHatch') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('autoHatchShort')"></span>
            </button>
            <!-- /ko -->
            <!-- ko with: RedesignAutomation.Automation.find('hatchInstant') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('hatchInstant')"></span>
            </button>
            <!-- /ko -->
            <!-- ko with: RedesignAutomation.Automation.find('hatchery12') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('twelveEggs')"></span>
            </button>
            <!-- /ko -->
        </div>
        <div id="rd-farm-tools" class="rd-switch-row">
            <!-- ko with: RedesignAutomation.Automation.find('autoFarm') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('autoHarvest')"></span>
            </button>
            <!-- /ko -->
            <!-- ko with: RedesignAutomation.Automation.find('farmSpeed') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: options.mode() === 'instant' ? RedesignShell.label('farmInstant') : RedesignShell.label('farmBoost') + ' ×' + options.mode()"></span>
            </button>
            <!-- /ko -->
        </div>
        <div id="rd-farmmodal-tools" class="rd-switch-row">
            <!-- ko with: RedesignAutomation.Automation.find('autoFarm') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('autoHarvest')"></span>
            </button>
            <!-- /ko -->
            <!-- ko with: RedesignAutomation.Automation.find('farmSpeed') -->
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: options.mode() === 'instant' ? RedesignShell.label('farmInstant') : RedesignShell.label('farmBoost') + ' ×' + options.mode()"></span>
            </button>
            <!-- /ko -->
        </div>
        <div id="rd-mine-tools" class="rd-module-tools" data-bind="with: RedesignAutomation.Automation.find('mineSpeed')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: options.mode() === 'instant' ? RedesignShell.label('mineInstant') : RedesignShell.label('mineBoost') + ' ×' + options.mode()"></span>
            </button>
        </div>
        <div id="rd-minemodal-tools" class="rd-inline-tools" data-bind="with: RedesignAutomation.Automation.find('mineSpeed')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: options.mode() === 'instant' ? RedesignShell.label('mineInstant') : RedesignShell.label('mineBoost') + ' ×' + options.mode()"></span>
            </button>
        </div>
        <div id="rd-minefind-tools" class="rd-inline-tools" data-bind="with: RedesignAutomation.Automation.find('mineInstantFind')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('mineFindInstant')"></span>
            </button>
        </div>
        <div id="rd-findmine-tools" class="rd-inline-tools" data-bind="with: RedesignAutomation.Automation.find('mineInstantFind')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('mineFindInstant')"></span>
            </button>
        </div>
        <div id="rd-oak-tools" class="rd-module-tools" data-bind="with: RedesignAutomation.Automation.find('oakItemsUnlimited')">
            <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('oakNoLimit')"></span>
            </button>
        </div>
        <!-- Mine treasures, redesigned: sell from the list (moved into #treasures). -->
        <div id="rd-treasures" class="rd-treasures">
            <div class="rd-tabs" role="tablist">
                <button type="button" role="tab" data-bind="click: () => RedesignShell.treasureFilter('sell'), attr: { 'aria-selected': RedesignShell.treasureFilter() === 'sell' ? 'true' : 'false' }, text: RedesignShell.label('treasuresToSell')"></button>
                <button type="button" role="tab" data-bind="click: () => RedesignShell.treasureFilter('all'), attr: { 'aria-selected': RedesignShell.treasureFilter() === 'all' ? 'true' : 'false' }, text: RedesignShell.label('treasuresAll')"></button>
            </div>
            <div class="rd-treasure-summary">
                <div class="rd-treasure-total">
                    <span class="rd-treasure-total-label" data-bind="text: RedesignShell.label('treasuresDiamonds')"></span>
                    <span class="rd-treasure-total-value"><img src="assets/images/currency/diamond.svg" alt=""><b class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.treasureSummary().diamonds)"></b></span>
                    <button type="button" class="rd-treasure-sellall" data-bind="click: () => RedesignShell.sellAllTreasures('diamond'), enable: RedesignShell.treasureSummary().diamonds > 0, text: RedesignShell.label('sellAll')"></button>
                </div>
                <div class="rd-treasure-total">
                    <span class="rd-treasure-total-label" data-bind="text: RedesignShell.label('treasuresPlates')"></span>
                    <span class="rd-treasure-total-value"><b class="rd-num" data-bind="text: RedesignShell.formatNumber(RedesignShell.treasureSummary().plates)"></b><small data-bind="text: RedesignShell.label('plates')"></small></span>
                    <button type="button" class="rd-treasure-sellall" data-bind="click: () => RedesignShell.sellAllTreasures('gem'), enable: RedesignShell.treasureSummary().plates > 0, text: RedesignShell.label('sellAll')"></button>
                </div>
            </div>
            <p class="rd-treasure-hint" data-bind="text: RedesignShell.treasures().length ? RedesignShell.label('treasuresHint') : RedesignShell.label('noTreasures')"></p>
            <div class="rd-treasure-list" data-bind="foreach: RedesignShell.treasures()">
                <div class="rd-treasure" data-bind="css: { 'is-locked': item.sellLocked(), 'is-unsellable': !sellable }">
                    <button type="button" class="rd-treasure-main" data-bind="click: () => RedesignShell.openTreasure($data)">
                        <img alt="" data-bind="attr: { src: item.image }">
                        <span class="rd-treasure-text">
                            <b data-bind="text: item.displayName"></b>
                            <small>
                                <span class="rd-num" data-bind="text: '×' + RedesignShell.formatNumber(owned)"></span>
                                <!-- ko if: sellable -->
                                · <img alt="" data-bind="attr: { src: gem ? Gems.image(item.type) : 'assets/images/currency/diamond.svg' }"><span class="rd-num" data-bind="text: RedesignShell.treasureValueText($data)"></span>
                                <!-- /ko -->
                            </small>
                        </span>
                    </button>
                    <!-- ko if: sellable -->
                    <button type="button" class="rd-treasure-lock" data-bind="click: () => item.toggleSellLock(), attr: { 'aria-pressed': item.sellLocked() ? 'true' : 'false', 'aria-label': RedesignShell.label('sellLock'), title: RedesignShell.label('sellLock') }">
                        <svg aria-hidden="true"><use data-bind="attr: { href: item.sellLocked() ? 'assets/images/redesign/icons.svg#i-lock' : 'assets/images/redesign/icons.svg#i-lock-open' }"></use></svg>
                    </button>
                    <button type="button" class="rd-treasure-sell" data-bind="click: () => RedesignShell.sellTreasure($data), enable: !item.sellLocked()">
                        <img alt="" data-bind="attr: { src: gem ? Gems.image(item.type) : 'assets/images/currency/diamond.svg' }">
                        <span class="rd-num" data-bind="text: RedesignShell.formatNumber(total)"></span>
                    </button>
                    <!-- /ko -->
                </div>
            </div>
        </div>
        <!-- Battle Frontier: welcome sheet and switches (moved into #battleFrontierInformation). -->
        <div id="rd-frontier" class="rd-frontier">
            <!-- ko ifnot: BattleFrontierRunner.started -->
            <div class="rd-frontier-stats">
                <div><small data-bind="text: RedesignShell.label('bfRecord')"></small><b class="rd-num" data-bind="text: RedesignShell.formatNumber(App.game.statistics.battleFrontierHighestStageCompleted())"></b></div>
                <div><small data-bind="text: RedesignShell.label('bfCheckpoint')"></small><b class="rd-num" data-bind="text: BattleFrontierRunner.hasCheckpoint() ? RedesignShell.formatNumber(BattleFrontierRunner.checkpoint()) : '–'"></b></div>
                <div><small data-bind="text: RedesignShell.label('bfPoints')"></small><b class="rd-num"><img src="assets/images/currency/battlePoint.svg" alt=""><span data-bind="text: RedesignShell.formatNumber(App.game.wallet.currencies[GameConstants.Currency.battlePoint]())"></span></b></div>
            </div>
            <p class="rd-frontier-intro" data-bind="text: RedesignShell.label('bfIntro')"></p>
            <div class="rd-frontier-actions">
                <!-- ko if: BattleFrontierRunner.hasCheckpoint() -->
                <button type="button" class="rd-frontier-primary" data-bind="click: () => BattleFrontierRunner.start(true), text: RedesignShell.label('bfResume').replace('{n}', RedesignShell.formatNumber(BattleFrontierRunner.checkpoint()))"></button>
                <!-- /ko -->
                <button type="button" data-bind="click: () => BattleFrontierRunner.start(false), css: { 'rd-frontier-primary': !BattleFrontierRunner.hasCheckpoint() }, text: RedesignShell.label('bfStart')"></button>
                <button type="button" class="rd-frontier-ghost" data-bind="click: () => App.game.battleFrontier.leave(), text: RedesignShell.label('bfLeave')"></button>
            </div>
            <!-- /ko -->
            <div class="rd-switch-row rd-frontier-switches">
                <!-- ko with: RedesignAutomation.Automation.find('autoFrontier') -->
                <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false', title: description() }">
                    <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('bfAuto')"></span>
                </button>
                <!-- /ko -->
                <!-- ko with: RedesignAutomation.Automation.find('frontierTimeFreeze') -->
                <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                    <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('bfFreeze')"></span>
                </button>
                <!-- /ko -->
                <!-- ko with: RedesignAutomation.Automation.find('frontierDamage') -->
                <button type="button" role="switch" class="rd-mini-switch" data-bind="click: () => toggle(), attr: { 'aria-checked': enabled() ? 'true' : 'false' }">
                    <i aria-hidden="true"></i><span data-bind="text: RedesignShell.label('bfDamage') + ' ' + (options.mode() === 'ko' ? 'K.O.' : '×' + options.mode())"></span>
                </button>
                <!-- /ko -->
            </div>
        </div>
        <div id="rd-tracker-go" class="rd-tracker-go">
            <!-- ko if: RedesignShell.trackedDestination() -->
            <button type="button" class="rd-action" data-bind="click: () => RedesignShell.travelTo(App.game.achievementTracker.trackedAchievement())">
                <span data-bind="text: RedesignShell.label('goThere')"></span>
                <svg aria-hidden="true"><use href="assets/images/redesign/icons.svg#i-chevron-right"></use></svg>
            </button>
            <!-- /ko -->
        </div>
    </div>

    <!-- Mini combat bar: the fight stays one tap away on every other page (mobile). -->
    <div id="rd-mini" data-bind="css: { 'has-foe': !!RedesignShell.foe() }">
        <!-- ko if: RedesignShell.foe() -->
        <button type="button" class="rd-mini-hit" data-bind="click: () => RedesignShell.attack(), enable: RedesignShell.canAttack(), attr: { 'aria-label': RedesignShell.label('attack') }">
            <img alt="" data-bind="attr: { src: RedesignShell.foe().getImage() }">
        </button>
        <button type="button" class="rd-mini-info" data-bind="click: () => RedesignShell.go('combat'), attr: { title: RedesignShell.label('goToCombat') }">
            <span class="rd-mini-line">
                <span class="rd-mini-name" data-bind="text: RedesignShell.foe().displayName"></span>
                <span class="rd-num rd-mini-hp" data-bind="text: RedesignShell.formatNumber(RedesignShell.foe().health())"></span>
            </span>
            <span class="rd-hpbar"><i data-bind="style: { width: RedesignShell.foe().healthPercentage() + '%' }"></i></span>
        </button>
        <!-- /ko -->
    </div>
</div>
